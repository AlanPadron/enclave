[project]
name = "enclave-server"
version = "0.2.0"
description = "enclave backend (FastAPI + python-socketio)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-socketio[asyncio]>=5.11",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "pydantic>=2.7",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
